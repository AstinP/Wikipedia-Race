<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WikiRace - {{ title }}</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding-top: 60px; }
        .top-bar { position: fixed; top: 0; left: 0; width: 100%; background: #111; color: white; display: flex; justify-content: space-around; align-items: center; padding: 12px 0; z-index: 1000; }
        .top-bar div { font-weight: bold; }
        .content { max-width: 900px; margin: 20px auto; padding: 0 20px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div>Current: {{ title }}</div>
        <div>Target: {{ target }}</div>
        <div>Clicks: {{ clicks }}</div>
        <a href="/" style="color: #ff4d4d; text-decoration: none;">Restart</a>
    </div>
    <div class="content">
        {{ content | safe }}
    </div>
</body>
</html>

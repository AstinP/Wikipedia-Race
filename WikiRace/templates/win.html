<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Target Reached!</title>
    <style>
        body { font-family: sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        h1 { margin-top: 0; }
        ul { text-align: left; background: #f8f9fa; padding: 20px 40px; border-radius: 8px; }
        .btn { display: inline-block; background-color: #28a745; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 15px; }
        .stats { display: flex; justify-content: space-around; margin: 20px 0; background: #eef2f5; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Target Reached!</h1>
        <p>Target Article: <strong>{{ target }}</strong></p>
        
        <div class="stats">
            <div>Clicks: <strong>{{ clicks }}</strong></div>
            <div>Time: <strong>{{ time }}s</strong></div>
            <div>Best Clicks: <strong>{{ highscore }}</strong></div>
        </div>

        <h3>Your Path:</h3>
        <ul>
            {% for item in path %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>

        <a href="{{ url_for('restart') }}" class="btn">Play Again</a>
    </div>
</body>
</html>

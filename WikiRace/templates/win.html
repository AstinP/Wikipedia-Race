<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Victory!</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #e8f5e9; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        ul { text-align: left; background: #f8f9fa; padding: 15px 30px; border-radius: 6px; }
        a { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Target Reached!</h1>
        <p>Target Article: <strong>{{ target }}</strong></p>
        <p>Total Clicks: <strong>{{ clicks }}</strong></p>
        <h3>Your Path:</h3>
        <ul>
            {% for step in path %}
                <li>{{ loop.index }}. {{ step }}</li>
            {% endfor %}
        </ul>
        <a href="/">Play Again</a>
    </div>
</body>
</html>
